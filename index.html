<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBA Emulator</title>
<style>
  :root { --bg:#f4f4f6; --fg:#1c1c20; --card:#ffffff; --accent:#5b4bdb; --muted:#6b6b76; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141418; --fg:#ececf1; --card:#1f1f26; --accent:#8b7dff; --muted:#9a9aa6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  #picker { background:var(--card); border:2px dashed var(--accent); border-radius:16px;
            padding:40px 24px; text-align:center; max-width:480px; width:100%; cursor:pointer; }
  #picker.drag { background:color-mix(in srgb, var(--accent) 12%, var(--card)); }
  #picker p { margin:8px 0 0; color:var(--muted); font-size:.9rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px;
           padding:10px 18px; font-size:1rem; cursor:pointer; }
  #game { display:none; width:100%; max-width:960px; aspect-ratio:3/2; }
  input[type=file] { display:none; }
  footer { margin-top:24px; color:var(--muted); font-size:.8rem; text-align:center; max-width:480px; }
</style>
</head>
<body>
  <h1>GBA Emulator</h1>

  <label id="picker">
    <button type="button" onclick="document.getElementById('rom').click()">Choose a ROM</button>
    <p>or drag a .gba file here</p>
    <input id="rom" type="file" accept=".gba,.zip,.7z">
  </label>

  <div id="game"></div>

  <footer>
    Runs entirely in your browser. Your ROM never leaves your device.
    Only use ROMs you legally own.
  </footer>

<script>
  const picker = document.getElementById('picker');
  const input  = document.getElementById('rom');

  input.addEventListener('change', () => input.files[0] && start(input.files[0]));
  picker.addEventListener('dragover', e => { e.preventDefault(); picker.classList.add('drag'); });
  picker.addEventListener('dragleave', () => picker.classList.remove('drag'));
  picker.addEventListener('drop', e => {
    e.preventDefault();
    picker.classList.remove('drag');
    if (e.dataTransfer.files[0]) start(e.dataTransfer.files[0]);
  });

  function start(file) {
    picker.style.display = 'none';
    const game = document.getElementById('game');
    game.style.display = 'block';

    // EmulatorJS configuration (GBA core is mGBA compiled to WebAssembly)
    window.EJS_player    = '#game';
    window.EJS_core      = 'gba';
    window.EJS_gameName  = file.name.replace(/\.[^.]+$/, '');
    window.EJS_gameUrl   = URL.createObjectURL(file);
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;

    const s = document.createElement('script');
    s.src = window.EJS_pathtodata + 'loader.js';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
